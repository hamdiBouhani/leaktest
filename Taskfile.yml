version: '3'

# ---------------------------------------------------------------------------
# Configuration
# ---------------------------------------------------------------------------

vars:
  PKG: github.com/hamdiBouhani/leaktest
  COVERAGE: coverage.out
  COVERAGE_HTML: coverage.html
  TEST_TIMEOUT: 60s
  GOFLAGS: ''

# ---------------------------------------------------------------------------
# Global settings
# ---------------------------------------------------------------------------

# Re-run a task if any of these files change (cache invalidation).
sources:
  - './**/*.go'
  - 'go.mod'
  - 'go.sum'

# Files generated by tasks — used by `task --status` to skip re-runs.
generates:
  - '{{.COVERAGE}}'
  - '{{.COVERAGE_HTML}}'

# Silence the "task: [name] cmd" echo. Set to false for debugging.
silent: false

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------

tasks:

  # -------------------------------------------------------------------------
  # Default
  # -------------------------------------------------------------------------

  default:
    desc: Show available tasks.
    cmds:
      - task --list-all

  # -------------------------------------------------------------------------
  # Build & install
  # -------------------------------------------------------------------------

  tidy:
    desc: Tidy go.mod and go.sum.
    cmds:
      - go mod tidy

  download:
    desc: Download module dependencies.
    cmds:
      - go mod download

  build:
    desc: Compile all packages.
    cmds:
      - go build {{.GOFLAGS}} ./...

  # -------------------------------------------------------------------------
  # Test
  # -------------------------------------------------------------------------

  test:
    desc: Run the test suite.
    cmds:
      - go test {{.GOFLAGS}} -count=1 -timeout {{.TEST_TIMEOUT}} ./...

  test:verbose:
    desc: Run tests with verbose output.
    cmds:
      - go test {{.GOFLAGS}} -count=1 -timeout {{.TEST_TIMEOUT}} -v ./...

  test:race:
    desc: Run tests with the race detector enabled.
    cmds:
      - go test {{.GOFLAGS}} -count=1 -timeout {{.TEST_TIMEOUT}} -race ./...

  test:short:
    desc: Run tests in short mode (skips long-running tests).
    cmds:
      - go test {{.GOFLAGS}} -count=1 -timeout {{.TEST_TIMEOUT}} -short ./...

  cover:
    desc: Generate a coverage profile and HTML report.
    cmds:
      - go test {{.GOFLAGS}} -count=1 -timeout {{.TEST_TIMEOUT}} -coverprofile={{.COVERAGE}} -covermode=atomic ./...
      - go tool cover -html={{.COVERAGE}} -o {{.COVERAGE_HTML}}
      - echo "Coverage report written to {{.COVERAGE_HTML}}"

  cover:func:
    desc: Print per-function coverage to stdout.
    cmds:
      - go test {{.GOFLAGS}} -count=1 -timeout {{.TEST_TIMEOUT}} -coverprofile={{.COVERAGE}} -covermode=atomic ./...
      - go tool cover -func={{.COVERAGE}}

  # -------------------------------------------------------------------------
  # Lint & vet
  # -------------------------------------------------------------------------

  vet:
    desc: Run go vet on all packages.
    cmds:
      - go vet ./...

  lint:
    desc: Run staticcheck (requires staticcheck installed).
    preconditions:
      - sh: command -v staticcheck
        msg: "staticcheck not found; install with: go install honnef.co/go/tools/cmd/staticcheck@latest"
    cmds:
      - staticcheck ./...

  fmt:
    desc: Format all Go source files.
    cmds:
      - go fmt ./...

  fmt:check:
    desc: Fail if any file is not gofmt-clean.
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files are not gofmt-clean:"
          echo "$unformatted"
          exit 1
        fi

  check:
    desc: Run fmt-check, vet, and tests. The "CI in a box" target.
    deps: [fmt:check, vet]
    cmds:
      - task: test

  # -------------------------------------------------------------------------
  # Examples
  # -------------------------------------------------------------------------

  examples:
    desc: Run all runnable examples.
    cmds:
      - task: examples:basic
      - task: examples:http

  examples:basic:
    desc: Run the basic example only.
    cmds:
      - go run ./examples/basic

  examples:http:
    desc: Run the http-server example only.
    cmds:
      - go run ./examples/http-server

  # -------------------------------------------------------------------------
  # Docs
  # -------------------------------------------------------------------------

  doc:
    desc: Print local package documentation.
    cmds:
      - go doc -all .

  doc:serve:
    desc: Serve pkg.go.dev-style docs at http://localhost:6060.
    cmds:
      - echo "Open http://localhost:6060/pkg/{{.PKG}}/"
      - go run golang.org/x/tools/cmd/godoc@latest -http=:6060

  # -------------------------------------------------------------------------
  # Housekeeping
  # -------------------------------------------------------------------------

  clean:
    desc: Remove build artifacts and coverage files.
    cmds:
      - go clean ./...
      - rm -f {{.COVERAGE}} {{.COVERAGE_HTML}}

  all:
    desc: Run all checks and examples. The full "green build".
    cmds:
      - task: check
      - task: examples